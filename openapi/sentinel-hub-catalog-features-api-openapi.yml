                    - 44.15044712021016
                  - - 13.558241653952589
                    - 45.144727105915536
                  - - 12.456873618680804
                    - 45.12550485074961
            bbox:
            - 12.456873618680804
            - 44.138006014975964
            - 13.558241653952589
            - 45.144727105915536
            properties:
              datetime: '2020-12-29T10:18:19Z'
              platform: sentinel-2b
              instruments:
              - msi
              constellation: sentinel-2
              gsd: 10
              eo:cloud_cover: 93.93
              proj:epsg: 32633
              proj:bbox:
              - 300000
              - 4890240
              - 409800
              - 5000040
              proj:geometry:
                type: MultiPolygon
                crs:
                  type: name
                  properties:
                    name: urn:ogc:def:crs:EPSG::32633
                coordinates:
                - - - - 300000.99988415383
                      - 5000039.000148304
                    - - 300000.99989785976
                      - 4890241.000124758
                    - - 352314.4884079728
                      - 4890241.000125499
                    - - 386653.8629171661
                      - 5000039.000149397
